name: Notify New LLM Repo Issues

on:
  workflow_dispatch: {}       # triggered externally by cron-job.org (reliable); GitHub's own
                               # `schedule:` trigger was removed since it was unreliable
                               # (see cron-job.org for the actual schedule)

permissions:
  contents: write            # needed to commit the updated state/state.json

jobs:
  check-issues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for new issues and notify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # auto-provided by Actions
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}        # you set this secret yourself
        run: python3 check_new_issues.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/state.json
          git diff --staged --quiet && exit 0
          git commit -m "Update check state [skip ci]"
          # In case another run pushed in between, retry once after rebasing
          # rather than failing the whole job (this state is cheap to redo).
          git push || (git pull --rebase && git push)
